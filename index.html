<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Digital Designing</title>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<!-- BACKGROUND WAVES -->
<div class="bg-waves">
  <svg viewBox="0 0 1440 600" preserveAspectRatio="none">
    <path id="wave1"
      d="M0,350 C240,300 480,400 720,370 960,340 1200,280 1440,320 L1440,600 L0,600 Z"
      fill="rgba(37,99,235,0.18)"
    />
    <path id="wave2"
      d="M0,380 C300,340 600,420 900,390 1200,360 1440,300 1440,300 L1440,600 L0,600 Z"
      fill="rgba(147,51,234,0.12)"
    />
  </svg>
</div>
  <!-- HERO SECTION -->
  <section class="hero">
    <img src="images/logo.png" alt="Digital Designing Logo" class="hero-logo">

    <h1>
      DIGITAL <span>DESIGNING</span>
    </h1>

    <p>
      Creative & Professional Design Solutions for Modern Businesses
    </p>

    <div class="hero-actions">
      <a href="#services" class="btn primary">View Services</a>
      <a href="#contact" class="btn secondary">Contact Us</a>
    </div>
  </section>

</body>
</html>
